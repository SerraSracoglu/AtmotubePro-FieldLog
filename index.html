<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Saha Günlüğü — GTÜ Kampüs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#1c2430; --panel:#ffffff; --line: rgba(28,36,48,0.12);
    --muted:#6b7580; --bg:#f3f5f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{ font-family:'Space Grotesk', system-ui, sans-serif; color:var(--ink); -webkit-tap-highlight-color: transparent; }
  .app{ max-width:520px; margin:0 auto; padding:18px 16px 40px; }
  .strip{ display:flex; gap:3px; height:6px; margin-bottom:14px; border-radius:3px; overflow:hidden; }
  .strip span{flex:1; background:var(--line);}
  .strip span.on{background:linear-gradient(90deg,#2f7dc4,#7d5bc2,#d98a2b,#3fa142,#5a6472);}
  header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  h1{ font-size:18px; font-weight:700; letter-spacing:-0.01em; margin:0; }
  .clock{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .sub{ font-size:12px; color:var(--muted); margin:2px 0 14px; }
  .id-row{
    display:flex; gap:8px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:14px;
  }
  .id-row label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); white-space:nowrap; }
  .id-row input{ flex:1; border:none; outline:none; background:transparent; font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--ink); min-width:0; }
  .manual-row{ display:flex; gap:8px; margin-top:2px; }
  .manual-row input{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:'Space Grotesk', sans-serif; font-size:13px; outline:none; color:var(--ink);
  }
  .manual-row button{
    border:none; border-radius:10px; padding:10px 14px; background:var(--ink); color:#fff;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; cursor:pointer;
  }
  .nav-btn.ghost{ background:var(--panel)!important; color:var(--ink)!important; border:1.5px dashed var(--line); }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,36,48,0.45); z-index:1300;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--panel); border-radius:16px; padding:18px; width:100%; max-width:360px;
  }
  .modal-box h3{ margin:0 0 10px; font-size:14.5px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .modal-box textarea{
    width:100%; min-height:70px; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:'Space Grotesk', sans-serif; font-size:13.5px; outline:none; color:var(--ink); resize:vertical;
    box-sizing:border-box;
  }
  .modal-actions{ display:flex; gap:8px; margin-top:12px; }
  .modal-actions button{
    flex:1; border:none; border-radius:10px; padding:11px; font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:13px; cursor:pointer;
  }
  .modal-actions .cancel{ background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .modal-actions .save{ background:var(--ink); color:#fff; }
  .id-status{ font-size:11px; color:#1f9e8b; font-family:'JetBrains Mono', monospace; }
  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 2px 8px; font-weight:600; }
  .section-label:first-of-type{margin-top:0;}
  .recent-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:4px; -webkit-overflow-scrolling:touch; }
  .recent-row::-webkit-scrollbar{display:none;}
  .recent-chip{
    flex-shrink:0; border:none; border-radius:20px; padding:8px 13px;
    color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .recent-chip:active{transform:scale(0.95);}
  .recent-empty{ font-size:12px; color:var(--muted); padding:6px 2px; }
  #map{ width:100%; height:400px; border-radius:14px; border:1px solid var(--line); margin-bottom:10px; background:#dfe3de; }
  .leaflet-container{ font-family:'Space Grotesk', sans-serif; }
  .bld-label{
    background:none; border:none; box-shadow:none;
    font-size:9.5px; font-weight:700; color:#1c2430;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    white-space:normal; text-align:center; line-height:1.15;
    display:flex; align-items:center; justify-content:center;
  }
  .zone-label{
    background:none; border:none; box-shadow:none;
    font-size:13px; font-weight:700; color:#1c2430;
    text-shadow:0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
    white-space:nowrap; text-align:center;
  }
  .entrance-marker{ display:flex; flex-direction:column; align-items:center; pointer-events:none; }
  .entrance-text{
    font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:11px; letter-spacing:0.03em;
    color:#1f9e8b; text-shadow:0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
    white-space:nowrap; margin-bottom:-3px;
  }
  .entrance-arrow{ font-size:26px; line-height:1; color:#1f9e8b; text-shadow:0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff; }
  .map-legend{ display:flex; flex-wrap:wrap; gap:7px 12px; margin:0 2px 10px; }
  .map-legend span{ font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .map-legend i{ width:9px;height:9px;border-radius:2px; display:inline-block; }
  .breadcrumb{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .crumb-back{
    display:flex; align-items:center; gap:5px;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px 6px 9px; font-size:12.5px; font-weight:600; color:var(--ink);
    cursor:pointer; font-family:'Space Grotesk', sans-serif;
  }
  .crumb-back:active{transform:scale(0.96);}
  .crumb-path{ font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono', monospace; }
  .log-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .count{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); }
  .log{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .log-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12.5px; }
  .log-row:last-child{border-bottom:none;}
  .dot{ width:9px;height:9px;border-radius:50%; flex-shrink:0; }
  .log-time{ color:var(--muted); min-width:64px; }
  .log-cat{ flex:1; color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:13px; min-width:0; }
  .log-note{ display:block; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:11.5px; margin-top:2px; white-space:normal; word-break:break-word; }
  .log-note-btn{ background:none; border:none; font-size:14px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
  .log-del{ background:none;border:none;color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:14px; cursor:pointer; padding:4px 6px; }
  .log-del:hover{color:#c0392b;}
  .empty{ padding:26px 14px; text-align:center; color:var(--muted); font-size:13px; }
  .actions{ display:flex; gap:8px; margin-top:14px; }
  .actions button{
    flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; padding:11px; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; cursor:pointer;
  }
  .actions button:active{transform:scale(0.98);}
  .actions button.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px;
    font-size:12.5px; font-family:'Space Grotesk', sans-serif;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:88%; text-align:center; z-index:1200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .box-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:10px; }
  .nav-btn{
    position:relative; border:none; border-radius:14px; padding:16px 12px 14px;
    text-align:left; color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:14px; cursor:pointer; min-height:56px; -webkit-user-select:none; user-select:none;
  }
  .nav-btn:active{transform:scale(0.96);}
</style>
</head>

<div class="app">

  <div class="strip"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>

  <header>
    <h1>Saha Günlüğü</h1>
    <div class="clock" id="clock">--:--:-- · --.--.----</div>
  </header>
  <p class="sub">GTÜ Kampüsü — bölge seçin, sonra bina/yol/alanlara dokunun.</p>

  <div class="id-row">
    <label for="pname">Ad Soyad</label>
    <input id="pname" type="text" placeholder="Ad Soyad" autocomplete="off">
    <span class="id-status" id="nameStatus"></span>
  </div>

  <div class="id-row">
    <label for="firstTime">İlk Ölçüm Saati</label>
    <input id="firstTime" type="time" step="1">
    <span class="id-status" id="firstTimeStatus"></span>
  </div>

  <div class="section-label">Son Kullanılanlar</div>
  <div class="recent-row" id="recentRow"><span class="recent-empty">Henüz kayıt yok</span></div>

  <div class="section-label">Harita</div>
  <div class="breadcrumb" id="mapBreadcrumb"></div>
  <div id="map"></div>
  <div class="map-legend" id="mapLegend"></div>

  <div id="roomArea"></div>

  <div class="log-head" style="margin-top:14px;">
    <div class="section-label" style="margin:0;">Kayıtlar</div>
    <div class="count" id="count">0 kayıt</div>
  </div>
  <div class="log" id="log"><div class="empty">Henüz kayıt yok.</div></div>

  <div class="actions">
    <button id="undoBtn">↩ Son kaydı sil</button>
    <button id="exportBtn" class="primary">⭳ CSV indir</button>
  </div>

</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

   VERİYİ KENDİN GÜNCELLEMEK İSTERSEN (Claude'a tekrar göndermeden):

   1) QGIS'te ilgili katmanı (örn. GTU-SouthEastBuilding) düzenle, kaydet.
   2) Katmana sağ tık → Dışa Aktar (Export) → Farklı Kaydet (Save Features As...)
      - Format: GeoJSON
      - CRS: EPSG:4326 - WGS 84  (shapefile'lar zaten bu projeksiyonda)
      - Alanlar: "id" ve "name" sütunlarının bulunduğundan emin ol
   3) Oluşan .geojson dosyasını bir metin editöründe (Not Defteri, VSCode vb.) aç,
      TÜM içeriğini kopyala.
   4) Bu HTML dosyasını bir metin editöründe aç, aşağıdaki const'lardan
      hangi katmanı güncellediysen onu bul:
        - Binalar   → const SE_BUILDINGS = ... ;
        - Bahçeler  → const SE_GARDENS   = ... ;
        - Otoparklar→ const SE_PARKING   = ... ;
        - Yollar    → const SE_ROADS     = ... ;
        - Orman     → const SE_FOREST    = ... ;
      "=" işaretinden sonraki { ... } bloğunu (satır sonundaki ; hariç)
      kopyaladığın yeni GeoJSON ile DEĞİŞTİR. Yapı ve alan isimleri
      ("id", "name") birebir aynı olduğu için başka hiçbir şeyi
      değiştirmene gerek yok.
   5) Dosyayı kaydet, tarayıcıda sayfayı yenile (F5) — değişiklik hemen görünür.

   NOT: Bina renk/etiket bilgisi (SE_BUILDING_INFO) ve oda/kat verisi

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDateTr(d){ return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function tickClock(){ document.getElementById('clock').textContent = fmtTime(new Date()) + ' · ' + fmtDateTr(new Date()); }
setInterval(tickClock, 1000); tickClock();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- Özel metin girişi pop-up'ı (window.prompt yerine — bazı mobil/WebView ortamlarında native prompt çalışmıyor) ---------- */
function showInputModal(title, defaultValue, onSave){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3>${title}</h3>
        <textarea id="modalInput"></textarea>
        <div class="modal-actions">
          <button class="cancel" id="modalCancel">İptal</button>
          <button class="save" id="modalSave">Kaydet</button>
        </div>
      </div>
    </div>`;
  const input = document.getElementById('modalInput');
  input.value = defaultValue || '';
  setTimeout(()=>{ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 30);

  function close(){ root.innerHTML = ''; }
  document.getElementById('modalCancel').addEventListener('click', close);
  document.getElementById('modalOverlay').addEventListener('click', (ev)=>{ if(ev.target.id === 'modalOverlay') close(); });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const val = input.value;
    close();
    onSave(val);
  });
}

  map.setMinZoom(map.getZoom());
  map.setMaxZoom(map.getZoom() + 8);
  map.options.maxBoundsViscosity = 1.0;
}

function currentChildren(){
  if(navPath.length === 0) return ZONE_TREE.children;
  return navPath[navPath.length-1].children;
}

function renderBreadcrumb(){
  const el = document.getElementById('mapBreadcrumb');
  if(navPath.length === 0){
    el.innerHTML = '<span class="crumb-path">Kampüs — bölge seçin</span>';
    return;
  }
  const parentLabel = navPath.length >= 2 ? navPath[navPath.length-2].label : 'Kampüs';
  const pathStr = navPath.map(n=>n.label.split(' (')[0]).join(' › ');
  el.innerHTML = `<button class="crumb-back" id="backBtn">‹ ${parentLabel}</button><span class="crumb-path">${pathStr}</span>`;
  document.getElementById('backBtn').addEventListener('click', goBack);
}
function goBack(){
  navPath.pop();
  renderCurrent();
}

function clearLayers(){
  currentLayerGroup.clearLayers();
  currentLabelGroup.clearLayers();
}

function renderCurrent(){
  clearLayers();
  renderBreadcrumb();
  renderLegend(null);

  const target = navPath.length ? navPath[navPath.length-1] : null;

  if(target && target.data){
    renderDataLevel(target.data, target.id);
  } else {
    renderBoundaryLevel(currentChildren());
  }
}

function renderBoundaryLevel(nodes){
  renderLegend('zones');
  const layers = [];
  nodes.forEach(node=>{
    if(!node.boundary) return;
    const layer = L.geoJSON(node.boundary, {
      style: { color: node.color, weight: node.placeholder?2:3, fillColor: node.color,
               fillOpacity: node.placeholder?0.15:0.25, dashArray: node.placeholder?'4,5':'6,4' }
    });
    layer.eachLayer(l=>{
      l.on('click', ()=> enterNode(node));
      try{
        const c = l.getBounds().getCenter();
        L.marker(c, {
          icon: L.divIcon({ className:'zone-label', html: node.label, iconSize:[140,18] }),
          interactive:false
        }).addTo(currentLabelGroup);
      }catch(e){}
    });
    layer.addTo(currentLayerGroup);
    layers.push(layer);
  });
  if(layers.length){
    const group = L.featureGroup(layers);
    fitAndLock(group.getBounds(), 0.03);
  }
}

function enterNode(node){
  if(node.children && node.children.length){ navPath.push(node); renderCurrent(); return; }
  if(node.data){ navPath.push(node); renderCurrent(); return; }
  showToast('Bu bölge için veri henüz eklenmedi');
}

function renderDataLevel(data, regionId){
  renderLegend('data');
  const allLayers = [];

  if(data.roads){
    const roadLayer = L.geoJSON(data.roads, { style:{ color:'#b8bcc2', weight:1, fillColor:'#c9ccd1', fillOpacity:0.55 } });
    roadLayer.eachLayer(l=>{
      const rid = l.feature.properties.id;
      const nm = l.feature.properties.name;
      const label = nm ? nm : ('Yol #' + rid);
      l.on('click', ()=> logEntry(null, label, null, '#607d8b'));
      if(nm){
        try{
          const c = l.getBounds().getCenter();
          L.marker(c, { icon: L.divIcon({ className:'bld-label', html: nm, iconSize:[100,30], iconAnchor:[50,15] }), interactive:false }).addTo(currentLabelGroup);
        }catch(e){}
      }
    });
    roadLayer.addTo(currentLayerGroup);
    allLayers.push(roadLayer);
  }
  if(data.gardens){
    const gardenLayer = L.geoJSON(data.gardens, { style:{ color:'#3fa142', weight:1, fillColor:'#8fbf7f', fillOpacity:0.35 } });
    gardenLayer.eachLayer(l=>{
      const gid = l.feature.properties.id;
      const nm = l.feature.properties.name;
      const label = nm ? nm : ('Yeşil Alan / Bahçe #' + gid);
      l.on('click', ()=> logEntry(null, label, null, '#3fa142'));
      if(nm){
        try{
          const c = l.getBounds().getCenter();
          L.marker(c, { icon: L.divIcon({ className:'bld-label', html: nm, iconSize:[100,30], iconAnchor:[50,15] }), interactive:false }).addTo(currentLabelGroup);
        }catch(e){}
      }
    });
    gardenLayer.addTo(currentLayerGroup);
    allLayers.push(gardenLayer);
  }
  if(data.forest){
    const forestLayer = L.geoJSON(data.forest, { style:{ color:'#1f6b2e', weight:1, fillColor:'#2f7d3f', fillOpacity:0.45 } });
    forestLayer.eachLayer(l=>{
      const fid = l.feature.properties.id;
      const nm = l.feature.properties.name;
      const label = nm ? nm : ('Ormanlık Alan #' + fid);
      l.on('click', ()=> logEntry(null, label, null, '#1f6b2e'));
      if(nm){
        try{
          const c = l.getBounds().getCenter();
          L.marker(c, { icon: L.divIcon({ className:'bld-label', html: nm, iconSize:[100,30], iconAnchor:[50,15] }), interactive:false }).addTo(currentLabelGroup);
        }catch(e){}
      }
    });
    forestLayer.addTo(currentLayerGroup);
    allLayers.push(forestLayer);
  }
  if(data.parking){
    const parkLayer = L.geoJSON(data.parking, { style:{ color:'#607d8b', weight:1, fillColor:'#90a4ae', fillOpacity:0.4 } });
    parkLayer.eachLayer(l=>{
      const pid = l.feature.properties.id;
      const nm = l.feature.properties.name;
      const label = nm ? nm : ('Otopark #' + pid);
      l.on('click', ()=> logEntry(null, label, null, '#607d8b'));
      if(nm){
        try{
          const c = l.getBounds().getCenter();
          L.marker(c, { icon: L.divIcon({ className:'bld-label', html: nm, iconSize:[100,30], iconAnchor:[50,15] }), interactive:false }).addTo(currentLabelGroup);
        }catch(e){}
      }
    });
    parkLayer.addTo(currentLayerGroup);
    allLayers.push(parkLayer);
  }
  if(data.buildings){
    const infoMap = data.buildingInfo || {};
    const bldLayer = L.geoJSON(data.buildings, {
      style: (feature)=>{
        const num = feature.properties.id;
        const info = num ? infoMap[num] : null;
        const color = info ? info.color : '#8a8f98';
        return { color: color, weight:2, fillColor: color, fillOpacity:0.45 };
      },
      onEachFeature: (feature, layer)=>{
        const num = feature.properties.id;
        const info = num ? infoMap[num] : null;
        const label = info ? info.label : (feature.properties.name || 'Bina (adsız)');
        const color = info ? info.color : '#8a8f98';
        layer.on('click', ()=> openBuildingPicker(regionId, num, label, color));
        try{
          const c = layer.getBounds().getCenter();
          L.marker(c, {
            icon: L.divIcon({ className:'bld-label', html: label, iconSize:[100,30], iconAnchor:[50,15] }),
            interactive:false
          }).addTo(currentLabelGroup);
          if(info && info.entrance){
            L.marker(c, {
              icon: L.divIcon({
                className:'entrance-marker',
                html: '<span class="entrance-text">GİRİŞ</span><span class="entrance-arrow">⬇</span>',
                iconSize:[70,44], iconAnchor:[35,44]
              }),
              interactive:false
            }).addTo(currentLabelGroup);
          }
        }catch(e){}
      }
    });
    bldLayer.addTo(currentLayerGroup);
    allLayers.push(bldLayer);
  }

  if(allLayers.length){
    const group = L.featureGroup(allLayers);
    try{ fitAndLock(group.getBounds(), 0.03); }catch(e){}
  }
}

function renderLegend(mode){
  const el = document.getElementById('mapLegend');
  if(mode === 'zones'){
    el.innerHTML = `
      <span><i style="background:#2f7dc4"></i>Aktif/veri var</span>
      <span><i style="background:#9aa1ab"></i>Henüz veri yok</span>`;
  } else if(mode === 'data'){
    el.innerHTML = `
      <span><i style="background:#8fbf7f"></i>Yeşil Alan</span>
      <span><i style="background:#90a4ae"></i>Otopark</span>
      <span><i style="background:#8a8f98"></i>Ortak Alan</span>
      <span><i style="background:#2f7dc4"></i>Bölümler</span>`;
  } else {
    el.innerHTML = '';
  }
}

// Başlangıç: en üst seviye (Kuzey/Güney)
renderCurrent();

/* ---------- Kat / Oda seçimi (koda gömülü sabit veri — ROOM_DATA) ---------- */
/* ======================================================================
   ODA / KAT VERİSİ — site kurulumu sırasında Claude tarafından buraya
   gömülür. Yapı: ROOM_DATA[bölge_id][bina_id] = [{kat, oda}, ...]
   Bölge id'leri: 'guney_dogu', 'guney_bati', 'kuzey' (ZONE_TREE'deki id'lerle aynı).
   Bina id'leri: harita üzerindeki bina numarasıyla (feature.properties.id) birebir aynı.
   Örnek:
     guney_dogu: {
       14: [ {kat:"1", oda:"Amfi-1"}, {kat:"2", oda:"CEV113"}, {kat:"2", oda:"CEV112"} ]
     }
   Bir binanın burada hiç kaydı yoksa, o binaya tıklanınca kat/oda sorulmadan
   direkt kayıt düşer.
   ====================================================================== */
const ROOM_DATA = {
  guney_dogu: {
    14: [ 
        {kat:"-1", oda:"Yemekhane"},{kat:"-1", oda:"Bilgisayar Laboratuvarı"},{kat:"-1", oda:"Kimya Laboratuvarı"},
        {kat:"Zemin", oda:"Amfi-1"}, {kat:"Zemin", oda:"Öğrenci Çalışma Odası"},{kat:"Zemin", oda:"ZL-16"},
        {kat:"1", oda:"CEV111"}, {kat:"1", oda:"CEV112"},{kat:"1", oda:"CEV113"}  
      ]
  },
  guney_bati: {},
  kuzey: {}
};


let activeRoomState = null; // {regionId, buildingId, label, color, floor}

function getFloorsForBuilding(regionId, buildingId){
  const region = ROOM_DATA[regionId];
  if(!region) return null;
  const rows = region[buildingId];
  if(!rows || !rows.length) return null;
  const floors = {};
  rows.forEach(r=>{
    const k = (r.kat===undefined || r.kat===null || String(r.kat).trim()==='') ? '—' : String(r.kat).trim();
    if(!floors[k]) floors[k] = [];
    if(r.oda) floors[k].push(String(r.oda));
  });
  return floors;
}

// "1", "2.5" gibi sayısal kat adlarına ". Kat" ekler; "Zemin", "Çatı Katı" gibi
// sayısal olmayan kat adlarını olduğu gibi bırakır.
function isNumericFloor(k){ return /^-?\d+(\.\d+)?$/.test(String(k).trim()); }
function floorLabel(k){
  if(k === '—') return 'Kat belirtilmemiş';
  return isNumericFloor(k) ? (k + '. Kat') : k;
}
function floorPrefix(k){
  if(k === '—' || k === null || k === undefined) return '';
  return isNumericFloor(k) ? (k + '. Kat — ') : (k + ' — ');
}

function openBuildingPicker(regionId, buildingId, label, color){
  const floors = getFloorsForBuilding(regionId, buildingId);
  if(!floors){ logEntry(buildingId, label, null, color); return; }
  activeRoomState = { regionId, buildingId, label, color, floor:null };
  renderRoomArea();
}

function closeRoomArea(){ activeRoomState = null; renderRoomArea(); }

function manualRoomEntry(){
  if(!activeRoomState) return;
  const { buildingId, label, color, floor } = activeRoomState;
  showInputModal('Öğrencinin bulunduğu odayı / konumu yazın', '', (val)=>{
    const roomText = (val || '').trim();
    if(!roomText) return;
    const finalRoom = floorPrefix(floor) + roomText + ' (manuel)';
    logEntry(buildingId, label, finalRoom, color);
    closeRoomArea();
  });
}

function renderRoomArea(){
  const area = document.getElementById('roomArea');
  if(activeRoomState === null){ area.innerHTML=''; return; }
  const { regionId, buildingId, label, color, floor } = activeRoomState;
  const floors = getFloorsForBuilding(regionId, buildingId) || {};

  if(floor === null){
    // Kat seçimi
    const floorKeys = Object.keys(floors).sort((a,b)=>{
      const na = parseFloat(a), nb = parseFloat(b);
      if(!isNaN(na) && !isNaN(nb)) return na-nb;
      return a.localeCompare(b, 'tr');
    });
    area.innerHTML = `
      <div class="breadcrumb"><button class="crumb-back" id="closeRooms">‹ Haritaya dön</button></div>
      <div class="section-label">#${buildingId} ${label} — Kat Seç</div>
      <div class="box-grid">` +
        floorKeys.map(k=>`<button class="nav-btn" data-floor="${k}" style="background:${color}">${floorLabel(k)}</button>`).join('') +
        `<button class="nav-btn ghost" id="manualBuilding">Diğer / Farklı Konum</button>
      </div>`;
    document.getElementById('closeRooms').addEventListener('click', closeRoomArea);
    document.getElementById('manualBuilding').addEventListener('click', manualRoomEntry);
    area.querySelectorAll('[data-floor]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeRoomState.floor = btn.getAttribute('data-floor');
        renderRoomArea();
      });
    });
  } else {
    // Oda seçimi (seçilen kat içinde)
    const rooms = floors[floor] || [];
    area.innerHTML = `
      <div class="breadcrumb"><button class="crumb-back" id="backFloors">‹ Katlar</button></div>
      <div class="section-label">#${buildingId} ${label} — ${floorPrefix(floor)}Oda Seç</div>
      <div class="box-grid">` +
        rooms.map(r=>`<button class="nav-btn" data-room="${r}" style="background:${color}">${r}</button>`).join('') +
        `<button class="nav-btn ghost" id="manualRoom">Diğer / Farklı Konum</button>
      </div>`;
    document.getElementById('backFloors').addEventListener('click', ()=>{ activeRoomState.floor = null; renderRoomArea(); });
    document.getElementById('manualRoom').addEventListener('click', manualRoomEntry);
    area.querySelectorAll('[data-room]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const roomVal = btn.getAttribute('data-room');
        const finalRoom = floorPrefix(floor) + roomVal;
        logEntry(buildingId, label, finalRoom, color);
        closeRoomArea();
      });
    });
  }
}

/* ---------- Kayıt işlemleri ---------- */
async function logEntry(num, label, room, color){
  const now = new Date();
  entries.push({ id: now.getTime().toString(36)+Math.random().toString(36).slice(2,6), num, label, room: room||'', note:'', color: color||'#5a6472', ts: now.getTime() });
  const key = (num||'x')+'|'+label+'|'+(room||'');
  recentEntries = [{num,label,room:room||'',color:color||'#5a6472',key}, ...recentEntries.filter(r=> r.key!==key)].slice(0, RECENT_MAX);
  await saveEntries(); await saveProfile();
  renderRecent(); renderLog();
  showToast(label + (room? ' — '+room:'') + ' — ' + fmtTime(now));
  if(navigator.vibrate) navigator.vibrate(15);
  sendToServer({ num, label, room: room||'', note:'', ts: now.getTime() });
}

function sendToServer(entry){
  if(!SERVER_URL) return;
  fetch(SERVER_URL.replace(/\/$/,'') + '/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      participant_name: participantName,
      first_measurement_time: firstMeasurementTime,
      ts: entry.ts, num: entry.num, label: entry.label, room: entry.room, note: entry.note || ''
    })
  }).then(res=>{ if(!res.ok) throw new Error('sunucu hatası'); })
    .catch(()=>{ showToast('⚠️ Sunucuya ulaşılamadı, kayıt telefonda saklı'); });
}

function renderRecent(){
  const row = document.getElementById('recentRow');
  if(recentEntries.length === 0){ row.innerHTML = '<span class="recent-empty">Henüz kayıt yok</span>'; return; }
  row.innerHTML = recentEntries.map(r=>{
    const label = r.label + (r.room? ' · '+r.room : '');
    return `<button class="recent-chip" style="background:${r.color}" data-key="${r.key}">${label}</button>`;
  }).join('');
  row.querySelectorAll('.recent-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const r = recentEntries.find(x=> x.key===btn.getAttribute('data-key'));
      if(r) logEntry(r.num, r.label, r.room||null, r.color);
    });
  });
}

/* ---------- Depolama ---------- */
async function loadData(){
  try{ entries = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ entries=[]; }
  try{
    const prof = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
    participantName = prof.participantName || '';
    firstMeasurementTime = prof.firstMeasurementTime || '';
    recentEntries = prof.recentEntries || [];
  }catch(e){ participantName=''; firstMeasurementTime=''; recentEntries=[]; }
  document.getElementById('pname').value = participantName;
  document.getElementById('firstTime').value = firstMeasurementTime;
  updateIdStatus();
  renderRecent(); renderLog();
}
async function saveEntries(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }catch(e){ showToast('Kaydetme hatası'); } }
async function saveProfile(){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({participantName, firstMeasurementTime, recentEntries})); }catch(e){} }
function updateIdStatus(){
  document.getElementById('nameStatus').textContent = participantName ? '✓' : '';
  document.getElementById('firstTimeStatus').textContent = firstMeasurementTime ? '✓' : '';
}

/* ---------- Kayıt günlüğü ---------- */
function renderLog(){
  const log = document.getElementById('log'); const count = document.getElementById('count');
  count.textContent = entries.length + ' kayıt';
  if(entries.length === 0){ log.innerHTML = '<div class="empty">Henüz kayıt yok.</div>'; return; }
  const sorted = [...entries].sort((a,b)=> b.ts-a.ts);
  log.innerHTML = sorted.map(e=>{
    const d = new Date(e.ts);
    const label = e.label + (e.room? ' — '+e.room : '');
    const noteHtml = e.note ? `<span class="log-note">📝 ${escapeHtml(e.note)}</span>` : '';
    return `<div class="log-row">
      <span class="dot" style="background:${e.color}; margin-top:4px;"></span>
      <span class="log-time">${fmtTime(d)}</span>
      <span class="log-cat">${label}${noteHtml}</span>
      <button class="log-note-btn" data-note-id="${e.id}" title="Not ekle/düzenle">${e.note ? '📝' : '📝'}</button>
      <button class="log-del" data-id="${e.id}" title="Sil">✕</button>
    </div>`;
  }).join('');
  log.querySelectorAll('.log-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      entries = entries.filter(e=> e.id!==btn.getAttribute('data-id'));
      await saveEntries(); renderLog(); showToast('Kayıt silindi');
    });
  });
  log.querySelectorAll('.log-note-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-note-id');
      const e = entries.find(x=> x.id===id);
      if(!e) return;
      showInputModal('Not', e.note || '', async (val)=>{
        e.note = val.trim();
        await saveEntries(); renderLog();
        showToast(e.note ? 'Not kaydedildi' : 'Not silindi');
      });
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('pname').addEventListener('input', async (ev)=>{
  participantName = ev.target.value.trim(); updateIdStatus(); await saveProfile();
});
document.getElementById('firstTime').addEventListener('input', async (ev)=>{
  firstMeasurementTime = ev.target.value; updateIdStatus(); await saveProfile();
});
document.getElementById('undoBtn').addEventListener('click', async ()=>{
  if(entries.length===0){ showToast('Silinecek kayıt yok'); return; }
  entries.sort((a,b)=>a.ts-b.ts); entries.pop();
  await saveEntries(); renderLog(); showToast('Son kayıt silindi');
});
document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(entries.length===0){ showToast('Aktarılacak kayıt yok'); return; }
  const sorted = [...entries].sort((a,b)=>a.ts-b.ts);
  const rows = [['ad_soyad','ilk_olcum_saati','tarih','saat','unix_ts_ms','bina_no','bina_adi','oda','not']];
  sorted.forEach(e=>{
    const d = new Date(e.ts);
    rows.push([participantName||'bilinmiyor', firstMeasurementTime||'', fmtDate(d), fmtTime(d), e.ts, e.num||'', e.label, e.room||'', e.note||'']);
  });
  const csv = rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `saha-gunlugu_${(participantName||'katilimci').replace(/\s+/g,'_')}_${fmtDate(new Date()).replace(/-/g,'')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('CSV indirildi');
});

loadData();
</script>
