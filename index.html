<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Saha Günlüğü — GTÜ Kampüs (Gerçek Harita)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#1c2430;
    --panel:#ffffff;
    --line: rgba(28,36,48,0.12);
    --muted:#6b7580;
    --bg:#f3f5f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{ font-family:'Space Grotesk', system-ui, sans-serif; color:var(--ink); -webkit-tap-highlight-color: transparent; }
  .app{ max-width:520px; margin:0 auto; padding:18px 16px 40px; }

  .strip{ display:flex; gap:3px; height:6px; margin-bottom:14px; border-radius:3px; overflow:hidden; }
  .strip span{flex:1; background:var(--line);}
  .strip span.on{background:linear-gradient(90deg,#2f7dc4,#7d5bc2,#d98a2b,#3fa142,#5a6472);}

  header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  h1{ font-size:18px; font-weight:700; letter-spacing:-0.01em; margin:0; }
  .clock{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .sub{ font-size:12px; color:var(--muted); margin:2px 0 14px; }

  .id-row{
    display:flex; gap:8px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:14px;
  }
  .id-row label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); white-space:nowrap; }
  .id-row input{ flex:1; border:none; outline:none; background:transparent; font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--ink); min-width:0; }
  .id-status{ font-size:11px; color:#1f9e8b; font-family:'JetBrains Mono', monospace; }

  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 2px 8px; font-weight:600; }
  .section-label:first-of-type{margin-top:0;}

  .recent-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:4px; -webkit-overflow-scrolling:touch; }
  .recent-row::-webkit-scrollbar{display:none;}
  .recent-chip{
    flex-shrink:0; border:none; border-radius:20px; padding:8px 13px;
    color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .recent-chip:active{transform:scale(0.95);}
  .recent-empty{ font-size:12px; color:var(--muted); padding:6px 2px; }

  #map{
    width:100%;
    height:400px;
    border-radius:14px;
    border:1px solid var(--line);
    margin-bottom:10px;
    background:#dfe3de;
  }
  .leaflet-container{ font-family:'Space Grotesk', sans-serif; }
  .bld-label{
    background:none; border:none; box-shadow:none;
    font-size:9.5px; font-weight:700; color:#1c2430;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    white-space:nowrap;
  }
  .map-legend{
    display:flex; flex-wrap:wrap; gap:7px 12px; margin:0 2px 10px;
  }
  .map-legend span{ font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .map-legend i{ width:9px;height:9px;border-radius:2px; display:inline-block; }

  .log-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .count{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); }
  .log{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .log-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12.5px; }
  .log-row:last-child{border-bottom:none;}
  .dot{ width:9px;height:9px;border-radius:50%; flex-shrink:0; }
  .log-time{ color:var(--muted); min-width:64px; }
  .log-cat{ flex:1; color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:13px; }
  .log-del{ background:none;border:none;color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:14px; cursor:pointer; padding:4px 6px; }
  .log-del:hover{color:#c0392b;}
  .empty{ padding:26px 14px; text-align:center; color:var(--muted); font-size:13px; }

  .actions{ display:flex; gap:8px; margin-top:14px; }
  .actions button{
    flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; padding:11px; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; cursor:pointer;
  }
  .actions button:active{transform:scale(0.98);}
  .actions button.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px;
    font-size:12.5px; font-family:'Space Grotesk', sans-serif;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:88%; text-align:center; z-index:1200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .box-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:10px; }
  .nav-btn{
    position:relative; border:none; border-radius:14px; padding:16px 12px 14px;
    text-align:left; color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:14px; cursor:pointer; min-height:56px; -webkit-user-select:none; user-select:none;
  }
  .nav-btn:active{transform:scale(0.96);}
  .breadcrumb{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .crumb-back{
    display:flex; align-items:center; gap:5px;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px 6px 9px; font-size:12.5px; font-weight:600; color:var(--ink);
    cursor:pointer; font-family:'Space Grotesk', sans-serif;
  }
</style>
</head>
<body>
<div class="app">

  <div class="strip"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>

  <header>
    <h1>Saha Günlüğü</h1>
    <div class="clock" id="clock">--:--:-- · --.--.----</div>
  </header>
  <p class="sub">GTÜ Güney Kampüs — gerçek bina sınırlarına dokunun.</p>

  <div class="id-row">
    <label for="pname">Ad Soyad</label>
    <input id="pname" type="text" placeholder="Ad Soyad" autocomplete="off">
    <span class="id-status" id="nameStatus"></span>
  </div>

  <div class="id-row">
    <label for="firstTime">İlk Ölçüm Saati</label>
    <input id="firstTime" type="time" step="1">
    <span class="id-status" id="firstTimeStatus"></span>
  </div>

  <div class="section-label">Son Kullanılanlar</div>
  <div class="recent-row" id="recentRow"><span class="recent-empty">Henüz kayıt yok</span></div>

  <div class="section-label">Harita</div>
  <div class="breadcrumb" id="mapBreadcrumb"></div>
  <div id="map"></div>
  <div class="map-legend">
    <span><i style="background:#2f7dc4"></i>Akademik Bölüm</span>
    <span><i style="background:#7d5bc2"></i>Enstitü</span>
    <span><i style="background:#d98a2b"></i>Sosyal/Yaşam</span>
    <span><i style="background:#5a6472"></i>İdari</span>
    <span><i style="background:#c0392b"></i>Sağlık/Diğer</span>
    <span><i style="background:#8fbf7f"></i>Yeşil Alan</span>
    <span><i style="background:#c9ccd1"></i>Yol</span>
  </div>

  <div id="roomArea"></div>

  <div class="log-head" style="margin-top:14px;">
    <div class="section-label" style="margin:0;">Kayıtlar</div>
    <div class="count" id="count">0 kayıt</div>
  </div>
  <div class="log" id="log"><div class="empty">Henüz kayıt yok.</div></div>

  <div class="actions">
    <button id="undoBtn">↩ Son kaydı sil</button>
    <button id="exportBtn" class="primary">⭳ CSV indir</button>
  </div>

</div>

<div class="toast" id="toast"></div>

const STORE_KEY = 'saha-gunlugu:kayitlar';
const PROFILE_KEY = 'saha-gunlugu:profil';
const RECENT_MAX = 6;

let entries = [];
let participantName = '';
let firstMeasurementTime = '';
let recentEntries = [];
let activeRoomBuilding = null;

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function tickClock(){ document.getElementById('clock').textContent = fmtTime(new Date()) + ' · ' + fmtDateTr(new Date()); }
function fmtDateTr(d){ return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
setInterval(tickClock, 1000); tickClock();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1500);
}

/* ---------- Harita ---------- */
// Arka plan katmanı YOK — sadece kendi verimizin (bina + bahçe) poligonları,
// nötr bir zemin üzerinde. Kampüs dışına kaydırma/zoom yapılamaz.
const map = L.map('map', {
  zoomControl:true,
  attributionControl:false,
  zoomSnap:0.1
}).setView([40.80953, 29.35974], 15);

let navZone = null; // null = sınır (bölge) seviyesi, 'guney' = bina seviyesi

// ---- Bölge sınırı katmanı (Güney gerçek veri; Kuzey henüz veri yok — yer tutucu) ----
const guneyBoundaryLayer = L.geoJSON(SOUTH_BOUNDARY_GEOJSON, {
  style: { color:'#2f7dc4', weight:3, fillColor:'#2f7dc4', fillOpacity:0.28, dashArray:'6,4' }
});
guneyBoundaryLayer.eachLayer(layer=>{
  layer.bindTooltip('Güney Kampüs — binaları görmek için dokunun', {sticky:true, className:'bld-label'});
  layer.on('click', ()=> enterZone('guney'));
});

const guneyBounds = guneyBoundaryLayer.getBounds();
// Kuzey için henüz shapefile yok — sınırın kuzeyine geçici bir yer tutucu kutu koyuyoruz.
const gb = guneyBounds;
const latSpan = gb.getNorth() - gb.getSouth();
const kuzeyPlaceholderCoords = [[
  [gb.getWest(),  gb.getNorth() + latSpan*0.05],
  [gb.getEast(),  gb.getNorth() + latSpan*0.05],
  [gb.getEast(),  gb.getNorth() + latSpan*0.55],
  [gb.getWest(),  gb.getNorth() + latSpan*0.55],
  [gb.getWest(),  gb.getNorth() + latSpan*0.05]
]];
const kuzeyBoundaryLayer = L.geoJSON(
  { type:'Feature', properties:{}, geometry:{ type:'Polygon', coordinates: kuzeyPlaceholderCoords } },
  { style:{ color:'#9aa1ab', weight:2, fillColor:'#9aa1ab', fillOpacity:0.18, dashArray:'4,5' } }
);
kuzeyBoundaryLayer.eachLayer(layer=>{
  layer.bindTooltip('Kuzey Kampüs — bina verisi henüz eklenmedi', {sticky:true, className:'bld-label'});
  layer.on('click', ()=> showToast('Kuzey kampüs verisi henüz yüklenmedi'));
});

const zoneGroup = L.featureGroup([guneyBoundaryLayer, kuzeyBoundaryLayer]).addTo(map);

// ---- Yollar (görsel bağlam, tıklanamaz) ----
const roadLayer = L.geoJSON(ROADS_GEOJSON, {
  style: { color:'#b8bcc2', weight:1, fillColor:'#c9ccd1', fillOpacity:0.55, interactive:false }
});

// ---- Yeşil alanlar (bahçe/açık alan) ----
const gardenLayer = L.geoJSON(GARDENS_GEOJSON, {
  style: { color:'#3fa142', weight:1, fillColor:'#8fbf7f', fillOpacity:0.35 }
});
gardenLayer.eachLayer(layer=>{
  const gid = layer.feature.properties.gid;
  layer.on('click', ()=> logEntry(0, 'Yeşil Alan / Bahçe #' + gid, null, '#3fa142'));
});

// ---- Binalar ----
const buildingLabelGroup = L.layerGroup();
const buildingLayer = L.geoJSON(BUILDINGS_GEOJSON, {
  style: (feature)=>{
    const num = feature.properties.num;
    const b = BUILDINGS[num];
    const color = b ? b.color : '#5a6472';
    return { color: color, weight:2, fillColor: color, fillOpacity:0.45 };
  },
  onEachFeature: (feature, layer)=>{
    const num = feature.properties.num;
    const b = BUILDINGS[num];
    if(!b) return;
    layer.on('click', ()=>{
      if(b.rooms && b.rooms.length){ openRoomPicker(num); }
      else { logEntry(num, b.label, null, b.color); }
    });
    const center = layer.getBounds().getCenter();
    L.marker(center, {
      icon: L.divIcon({ className:'bld-label', html: '#'+num, iconSize:[26,14] }),
      interactive:false
    }).addTo(buildingLabelGroup);
  }
});

function fitAndLock(bounds, padRatio){
  const padded = bounds.pad(padRatio);
  map.fitBounds(padded);
  map.setMaxBounds(padded);
  map.setMinZoom(map.getZoom());
  map.setMaxZoom(map.getZoom() + 5);
  map.options.maxBoundsViscosity = 1.0;
}

function showZoneLevel(){
  navZone = null;
  map.removeLayer(buildingLayer); map.removeLayer(gardenLayer); map.removeLayer(buildingLabelGroup); map.removeLayer(roadLayer);
  if(!map.hasLayer(zoneGroup)) zoneGroup.addTo(map);
  const allZoneBounds = L.featureGroup([guneyBoundaryLayer, kuzeyBoundaryLayer]).getBounds();
  fitAndLock(allZoneBounds, 0.05);
  renderMapBreadcrumb();
}

function enterZone(zoneId){
  if(zoneId !== 'guney') return; // şimdilik sadece güney'de gerçek veri var
  navZone = zoneId;
  map.removeLayer(zoneGroup);
  roadLayer.addTo(map);
  gardenLayer.addTo(map);
  buildingLayer.addTo(map);
  buildingLabelGroup.addTo(map);
  const group = L.featureGroup([buildingLayer, gardenLayer]);
  fitAndLock(group.getBounds(), 0.06);
  renderMapBreadcrumb();
}

function renderMapBreadcrumb(){
  const el = document.getElementById('mapBreadcrumb');
  if(navZone === null){
    el.innerHTML = '<span class="crumb-path">Kampüs — bölge seçin</span>';
  } else {
    el.innerHTML = '<button class="crumb-back" id="backToZones">‹ Kampüs</button><span class="crumb-path">Güney Kampüs</span>';
    document.getElementById('backToZones').addEventListener('click', showZoneLevel);
  }
}

// Başlangıç: bölge (sınır) seviyesi
showZoneLevel();

/* ---------- Oda seçimi (bina bazında, ör. Çevre Müh.) ---------- */
function openRoomPicker(num){
  activeRoomBuilding = num;
  renderRoomArea();
}
function renderRoomArea(){
  const area = document.getElementById('roomArea');
  if(activeRoomBuilding === null){ area.innerHTML=''; return; }
  const b = BUILDINGS[activeRoomBuilding];
  area.innerHTML = `
    <div class="breadcrumb"><button class="crumb-back" id="closeRooms">‹ Haritaya dön</button></div>
    <div class="section-label">#${activeRoomBuilding} ${b.label} — Oda Seç</div>
    <div class="box-grid">` + b.rooms.map(r=>`<button class="nav-btn" data-room="${r}" style="background:${b.color}">${r}</button>`).join('') + `</div>`;
  document.getElementById('closeRooms').addEventListener('click', ()=>{ activeRoomBuilding=null; renderRoomArea(); });
  area.querySelectorAll('[data-room]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      logEntry(activeRoomBuilding, b.label, btn.getAttribute('data-room'), b.color);
      activeRoomBuilding = null; renderRoomArea();
    });
  });
}

/* ---------- Kayıt işlemleri ---------- */
async function logEntry(num, label, room, color){
  const now = new Date();
  entries.push({ id: now.getTime().toString(36)+Math.random().toString(36).slice(2,6), num, label, room: room||'', color: color||'#5a6472', ts: now.getTime() });
  const key = num+'|'+(room||'');
  recentEntries = [{num,label,room:room||'',color:color||'#5a6472',key}, ...recentEntries.filter(r=> r.key!==key)].slice(0, RECENT_MAX);
  await saveEntries(); await saveProfile();
  renderRecent(); renderLog();
  showToast(label + (room? ' — '+room:'') + ' — ' + fmtTime(now));
  if(navigator.vibrate) navigator.vibrate(15);
  sendToServer({ num, label, room: room||'', ts: now.getTime() });
}

// Sunucuya gönderme — arka planda, sessizce dener. Başarısız olsa bile
// kayıt zaten yukarıda telefonda (localStorage) saklandı, veri kaybolmaz.
function sendToServer(entry){
  if(!SERVER_URL) return;
  fetch(SERVER_URL.replace(/\/$/,'') + '/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      participant_name: participantName,
      first_measurement_time: firstMeasurementTime,
      ts: entry.ts,
      num: entry.num,
      label: entry.label,
      room: entry.room
    })
  }).then(res=>{
    if(!res.ok) throw new Error('sunucu hatası');
  }).catch(()=>{
    showToast('⚠️ Sunucuya ulaşılamadı, kayıt telefonda saklı');
  });
}
function renderRecent(){
  const row = document.getElementById('recentRow');
  if(recentEntries.length === 0){ row.innerHTML = '<span class="recent-empty">Henüz kayıt yok</span>'; return; }
  row.innerHTML = recentEntries.map(r=>{
    const label = r.label + (r.room? ' · '+r.room : '');
    return `<button class="recent-chip" style="background:${r.color}" data-key="${r.key}">${label}</button>`;
  }).join('');
  row.querySelectorAll('.recent-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const r = recentEntries.find(x=> x.key===btn.getAttribute('data-key'));
      if(r) logEntry(r.num, r.label, r.room||null, r.color);
    });
  });
}

/* ---------- Depolama ---------- */
async function loadData(){
  try{ entries = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }catch(e){ entries=[]; }
  try{
    const prof = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
    participantName = prof.participantName || '';
    firstMeasurementTime = prof.firstMeasurementTime || '';
    recentEntries = prof.recentEntries || [];
  }catch(e){ participantName=''; firstMeasurementTime=''; recentEntries=[]; }
  document.getElementById('pname').value = participantName;
  document.getElementById('firstTime').value = firstMeasurementTime;
  updateIdStatus();
  renderRecent(); renderLog();
}
async function saveEntries(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }catch(e){ showToast('Kaydetme hatası'); } }
async function saveProfile(){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({participantName, firstMeasurementTime, recentEntries})); }catch(e){} }
function updateIdStatus(){
  document.getElementById('nameStatus').textContent = participantName ? '✓' : '';
  document.getElementById('firstTimeStatus').textContent = firstMeasurementTime ? '✓' : '';
}

/* ---------- Kayıt günlüğü ---------- */
function renderLog(){
  const log = document.getElementById('log'); const count = document.getElementById('count');
  count.textContent = entries.length + ' kayıt';
  if(entries.length === 0){ log.innerHTML = '<div class="empty">Henüz kayıt yok.</div>'; return; }
  const sorted = [...entries].sort((a,b)=> b.ts-a.ts);
  log.innerHTML = sorted.map(e=>{
    const d = new Date(e.ts);
    const label = e.label + (e.room? ' — '+e.room : '');
    return `<div class="log-row">
      <span class="dot" style="background:${e.color}"></span>
      <span class="log-time">${fmtTime(d)}</span>
      <span class="log-cat">${label}</span>
      <button class="log-del" data-id="${e.id}" title="Sil">✕</button>
    </div>`;
  }).join('');
  log.querySelectorAll('.log-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      entries = entries.filter(e=> e.id!==btn.getAttribute('data-id'));
      await saveEntries(); renderLog(); showToast('Kayıt silindi');
    });
  });
}

document.getElementById('pname').addEventListener('input', async (ev)=>{
  participantName = ev.target.value.trim(); updateIdStatus(); await saveProfile();
});
document.getElementById('firstTime').addEventListener('input', async (ev)=>{
  firstMeasurementTime = ev.target.value; updateIdStatus(); await saveProfile();
});
document.getElementById('undoBtn').addEventListener('click', async ()=>{
  if(entries.length===0){ showToast('Silinecek kayıt yok'); return; }
  entries.sort((a,b)=>a.ts-b.ts); entries.pop();
  await saveEntries(); renderLog(); showToast('Son kayıt silindi');
});
document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(entries.length===0){ showToast('Aktarılacak kayıt yok'); return; }
  const sorted = [...entries].sort((a,b)=>a.ts-b.ts);
  const rows = [['ad_soyad','ilk_olcum_saati','tarih','saat','unix_ts_ms','bina_no','bina_adi','oda']];
  sorted.forEach(e=>{
    const d = new Date(e.ts);
    rows.push([participantName||'bilinmiyor', firstMeasurementTime||'', fmtDate(d), fmtTime(d), e.ts, e.num, e.label, e.room||'']);
  });
  const csv = rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `saha-gunlugu_${(participantName||'katilimci').replace(/\s+/g,'_')}_${fmtDate(new Date()).replace(/-/g,'')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('CSV indirildi');
});

loadData();
</script>
</body>
</html>
